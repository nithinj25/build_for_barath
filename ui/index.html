    --line: #e1e0d9; --line-2: #c3c2b7; --ring: rgba(11,11,11,0.10);
    --brand: #1c5cab; --brand-ink: #ffffff; --accent: #2a78d6; --accent-soft: #e8f1fc;
    --strong: #1c5cab; --possible: #3987e5; --weak: #86b6ef; --tier-ink: #ffffff; --weak-ink: #0d366b;
    --support: #2a78d6; --oppose: #e34948; --oppose-soft: #fdecec; --support-soft: #e8f1fc;
    --good: #006300; --good-soft: #e6f4e6; --caution-soft: #fff4d6; --caution-ink: #6b4a00;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {

      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #95938c;
      --line: #2c2c2a; --line-2: #383835; --ring: rgba(255,255,255,0.10);
      --brand: #184f95; --accent: #3987e5; --accent-soft: #16273d;
      --strong: #6da7ec; --possible: #3987e5; --weak: #256abf; --tier-ink: #0b0b0b; --weak-ink: #ffffff;
      --support: #3987e5; --oppose: #e66767; --oppose-soft: #3a1f1f; --support-soft: #16273d;
      --good: #0ca30c; --good-soft: #13301a; --caution-soft: #3a2f10; --caution-ink: #f2d38a;
      --shadow: none;
    }
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Nirmala UI", sans-serif; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* app bar */
  .bar { background: var(--brand); color: var(--brand-ink); }
  .bar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: .01em; }
  .logo small { display: block; font-weight: 400; font-size: 12px; opacity: .85; }
  .mark { width: 30px; height: 30px; border-radius: 7px; background: rgba(255,255,255,.16); display: grid; place-items: center; }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; align-items: center; }
  nav a { color: var(--brand-ink); text-decoration: none; padding: 7px 12px; border-radius: 8px; font-weight: 500; opacity: .88; }
  nav a[aria-current=page] { background: rgba(255,255,255,.18); opacity: 1; }
  .lang { background: transparent; color: var(--brand-ink); border: 1px solid rgba(255,255,255,.45); border-radius: 8px; padding: 5px 10px; margin-left: 6px; }
  .pill-synth { font-size: 12px; background: rgba(255,255,255,.18); padding: 3px 10px; border-radius: 99px; }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }
  @media (max-width: 700px) { main, .bar-inner { padding-left: 16px; padding-right: 16px; } nav { margin-left: 0; } }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  :lang(hi) h3 { text-transform: none; letter-spacing: 0; font-size: 14px; }
  .lede { color: var(--ink-2); margin: 0 0 18px; max-width: 800px; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
  .stack > * + * { margin-top: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .space { height: 16px; }

  /* filters */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .filters label { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  select, input[type=search], input[type=text], textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; min-width: 170px; }
  .notice { border-radius: 10px; padding: 12px 14px; font-size: 14px; margin: 0 0 14px; }
  .notice.info { background: var(--accent-soft); }
  .notice.caution { background: var(--caution-soft); color: var(--caution-ink); }
  .notice .btn { margin-left: 8px; }

  /* tier badge */
  .tier { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
  .tier.strong { background: var(--strong); color: var(--tier-ink); }
  .tier.possible { background: var(--possible); color: var(--tier-ink); }
  .tier.weak { background: var(--weak); color: var(--weak-ink); }
  .dots { display: inline-flex; gap: 2px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .35; }
  .dots i.on { opacity: 1; }
  .rarity { font-size: 13px; color: var(--ink-2); }

  /* cards and lists */
  .leads { display: grid; gap: 12px; }
  .lead { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow);
          display: grid; grid-template-columns: 1fr auto; gap: 10px 18px; cursor: pointer; }
  .lead:hover { border-color: var(--line-2); }
  .lead-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .crime { font-weight: 600; }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; grid-column: 1 / -1; }
  .place { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; min-width: 0; }
  .place b { display: block; font-size: 15px; }
  .place span { font-size: 12.5px; color: var(--muted); }
  .gap { text-align: center; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .gap svg { display: block; margin: 0 auto 2px; }
  @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } .gap { text-align: left; } .gap svg { display: none; } }
  .full { grid-column: 1 / -1; }
  .reasons-inline { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: var(--support-soft); border-radius: 99px; padding: 3px 10px; }
  .xstate { font-size: 12px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 1px 8px; }
  .truth { font-size: 12px; font-weight: 600; color: var(--good); background: var(--good-soft); border-radius: 99px; padding: 2px 9px; }
  .btn { background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 14px; font-weight: 500; }
  .btn:hover { border-color: var(--ink-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
  .lane { text-align: left; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 14px; display: grid; gap: 2px; }
  .lane span { font-size: 12.5px; color: var(--muted); }
  .lane[aria-selected=true] { border: 2px solid var(--accent); background: var(--accent-soft); padding: 9px 13px; }
  .lane-help { margin: 4px 0 14px; }
  @media (max-width: 640px) { .lanes { grid-template-columns: 1fr; } }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 16px; }
  .route { font-weight: 600; font-size: 15px; }

  .count { font-weight: 700; background: var(--ink); color: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: 13px; }

  .fir { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin: 0; }

  .reason { display: grid; grid-template-columns: 26px 1fr 150px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }

  .reason .ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .ico.shared { background: var(--support-soft); color: var(--support); }
  .ico.different { background: var(--oppose-soft); color: var(--oppose); }
  .ico.timing { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .reason .what { font-weight: 600; }
  .reason .why { font-size: 13px; color: var(--muted); }
  .weight { font-size: 12px; color: var(--muted); text-align: right; }
  .weight .track { height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; margin-bottom: 3px; border: 1px solid var(--line); }
  .weight .fill { position: absolute; top: -1px; bottom: -1px; border-radius: 4px; }
  .notrec { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .narr { white-space: pre-wrap; font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions textarea { flex: 1 1 260px; min-height: 40px; }
  .actions input { flex: 0 1 220px; }
  .saved { color: var(--good); font-weight: 600; }
  .history { display: grid; gap: 6px; font-size: 13.5px; }
  .history div { padding: 6px 10px; background: var(--surface-2); border-radius: 8px; }
  .shortlist { display: grid; gap: 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 99px; padding: 6px 14px; }
  .tabs button[aria-pressed=true] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .back { display: inline-block; margin-bottom: 12px; text-decoration: none; }
  .howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .stat { font-size: 28px; font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* series */
  .map { height: 340px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }

  .pin span { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff;

  .timeline svg { width: 100%; height: auto; display: block; }
  .tablewrap { overflow-x: auto; }
  table.firs { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.firs th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12.5px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  table.firs td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.firs td.num { font-weight: 700; color: var(--accent); }

  @media print {
    .bar, nav, .actions, .back, .noprint, .pager { display: none !important; }
    body { background: #fff; color: #000; }
    .card, .lead { box-shadow: none; border-color: #bbb; break-inside: avoid; }
    main { padding: 0; }
  }
</style>

function t(s, vars = {}) {
  const text = LANG === "hi" && HI[s] != null ? HI[s] : s;

}
const num = n => Number(n).toLocaleString("en-IN");
const val = v => v == null ? "—" : TOKENS[LANG][v] || String(v).split(";").filter(Boolean)
  .map(x => VALUES[LANG][x] || VALUES.en[x] || x.replace(/_/g, " ")).join(", ") || VALUES[LANG].none || "none";
const field = f => FIELDS[LANG][f] || FIELDS.en[f] || f.replace(/_/g, " ");
const crime = c => CRIMES[LANG][c] || String(c || "").replace(/_/g, " ").toLowerCase();
const cases = c => CRIME_CASES[LANG][c] || CRIME_CASES[LANG].CROSS_TYPE;

const district = d => (LANG === "hi" && DISTRICTS_HI[d]) || d;
const where = (d, s) => `${district(d)}, ${state(s)}`;
const date = d => d ? new Date(d).toLocaleDateString(LANG === "hi" ? "hi-IN" : "en-IN", { day: "numeric", month: "short", year: "numeric" }) : "—";
const pct = s => s < 0.01 ? t("under 1%") : `${Math.round(s * 100)}%`;

  if (days < 60) return t("{n} weeks", { n: Math.round(days / 7) });

}
function daysBetween(a, b) { return a && b ? Math.round(Math.abs(new Date(a) - new Date(b)) / 864e5) : null; }

}

      shared.map(r => h("span", { class: "chip" }, reasonPhrase(r, item.crime_type === c.crime_type ? c.crime_type : "CROSS_TYPE")))));
}
function firCard(c, title) {
  const rows = [["FIR no.", c.fir_no], ["Police station", c.police_station], ["District", where(c.district, c.state_code)],
    ["Offence", crime(c.crime_type)], ["Occurred", `${date(c.occurred_from)} – ${date(c.occurred_to)}`], ["Registered", date(c.registered_at)]];
  return h("section", { class: "card" },
    h("div", { class: "firhead" }, h("b", {}, title), h("span", { class: "muted small" }, c.case_id)),
    h("dl", { class: "fir" }, rows.map(([k, v]) => [h("dt", {}, t(k)), h("dd", {}, v ?? "—")])),
    c.needs_extraction ? h("p", { class: "notice caution small" }, t("This state records MO only as free text; structured details are pending extraction.")) : null);
}

// ---------- compare ----------
const VERDICT_TEXT = { confirmed: "linked", rejected: "not linked", investigate: "needs investigation" };
async function showCompare(a, b) {
  setNav("search");
  loading();
  let p, history;
  // The decision history is a convenience: if it cannot be read, the comparison still shows.
  try { [p, history] = await Promise.all([api(`/pairs/${a}__${b}`), api(`/links/${a}__${b}/feedback`).catch(() => ({ items: [] }))]); } catch (e) { return fail(e); }
  const crimeType = p.same_type ? p.case_a.crime_type : "CROSS_TYPE";
  const timing = p.reasons.find(r => r.kind === "timing");
  const shared = p.reasons.filter(r => r.kind === "shared");
  const different = p.reasons.filter(r => r.kind === "different");
  const notRec = p.reasons.filter(r => r.kind === "not_recorded");
  const maxAbs = Math.max(1, ...p.reasons.map(r => Math.abs(r.bits)));

  const reasonRow = r => {
    let icon, what, why;
    if (r.kind === "timing") {
      icon = h("div", { class: "ico timing", "aria-hidden": "true" }, "⏱");
      what = t("{gap} apart", { gap: gapText(r.days) });
      why = t(r.bits > 0.5 ? "Serial offences usually come in bursts — a short gap supports a link."
            : r.bits < -0.5 ? "A long gap makes the same offender less likely." : "The gap neither supports nor weakens a link.");
    } else if (r.kind === "shared") {
      icon = h("div", { class: "ico shared", "aria-hidden": "true" }, "✓");
      what = val(r.shared_value ?? r.value);
      const v = { pct: r.share == null ? "" : pct(r.share), of: cases(crimeType) };
      why = t("{field} — same in both FIRs. ", { field: field(r.field) }) + (r.share == null ? "" :
        r.share < 0.01 ? t("Fewer than 1 in 100 {of} have this, so it is a telling detail.", v) :
        r.share < 0.2 ? t("Only {pct} of {of} have this, so it is a telling detail.", v) :
        r.share < 0.5 ? t("{pct} of {of} have this.", v) : t("Common — {pct} of {of} have this, so it counts for little.", v));
    } else {
      icon = h("div", { class: "ico different", "aria-hidden": "true" }, "✕");
      what = t("{a} vs {b}", { a: val(r.value), b: val(r.other_value) });
      why = t("{field} — different in the two FIRs.", { field: field(r.field) });
    }
    const w = Math.abs(r.bits) / maxAbs * 50;
    const fill = r.bits >= 0 ? `left:50%;width:${w}%;background:var(--support)` : `left:${50 - w}%;width:${w}%;background:var(--oppose)`;
    return h("div", { class: "reason" }, icon, h("div", {}, h("div", { class: "what" }, what), h("div", { class: "why" }, why)),
      h("div", { class: "weight", title: `${r.bits >= 0 ? "+" : ""}${r.bits.toFixed(2)} bits` },
        h("div", { class: "track" }, h("div", { class: "fill", style: fill })), strengthWord(r.bits)));
  };

  const name = h("input", { type: "text", value: officer(), placeholder: t("Officer name (demo — not verified)"), "aria-label": t("Officer name (demo — not verified)"),
    onchange: e => { try { localStorage.setItem("officer", e.target.value.trim()); } catch (err) {} } });
  const note = h("textarea", { placeholder: t("Note for the case file (optional)"), "aria-label": t("Note for the case file (optional)") });
  const status = h("span", {});
  const historyBox = h("div", { class: "history" });
  const drawHistory = items => historyBox.replaceChildren(...(items.length ? items.map(f => h("div", {},
    h("b", {}, t(VERDICT_TEXT[f.verdict] || f.verdict)), ` · ${f.actor_id === "anonymous" ? t("anonymous") : f.actor_id.replace(/^demo:/, "")} · ${date(f.timestamp)}`,
    f.note ? ` — ${f.note}` : "")) : [h("span", { class: "muted" }, t("No decisions yet."))]));
  drawHistory(history.items);
  const decide = async verdict => {
    try { localStorage.setItem("officer", name.value.trim()); } catch (e) {}
    try {
      await api(`/links/${a}__${b}/feedback`, { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ verdict, note: note.value }) });
      status.replaceChildren(h("span", { class: "saved" }, t("Recorded: {v}", { v: t(VERDICT_TEXT[verdict]) })));
      drawHistory((await api(`/links/${a}__${b}/feedback`).catch(() => ({ items: [] }))).items);
    } catch (e) { status.textContent = e.message; }
  };
  const narrative = c => h("div", { class: "narr" }, [c.mo_description, c.narrative_text].filter(Boolean).join("\n\n") || t("No narrative."));
  const rarity = rarityText(p);
  const detailsText = t(shared.length === 1 ? "The evidence comes from {n} shared detail" : "The evidence comes from {n} shared details", { n: shared.length }) +
    (timing ? t(" and the {gap} between them", { gap: gapText(timing.days) }) : "") +
    (different.length ? t(different.length === 1 ? ", set against {n} difference" : ", set against {n} differences", { n: different.length }) : "") + t(". ");

  render(
    h("a", { class: "back", href: "javascript:history.back()" }, t("← Back")),
    caseNotices(p.case_a), p.case_b.type_check ? caseNotices({ type_check: p.case_b.type_check }) : null,
    h("section", { class: "card" },
      h("div", { class: "verdict" }, tierBadge(p), h("span", { class: "big" }, p.same_type ? crime(p.case_a.crime_type) : `${crime(p.case_a.crime_type)} ↔ ${crime(p.case_b.crime_type)}`),
        p.cross_state ? h("span", { class: "xstate" }, t("Across states")) : null,
        p.ground_truth_link === true ? h("span", { class: "truth" }, t("✓ true link (synthetic truth)")) : null,
        p.ground_truth_link === false ? h("span", { class: "muted small" }, t("not a true link in the synthetic truth")) : null),
      h("p", { class: "explain" }, h("b", {}, `${rarity[0].toUpperCase()}${rarity.slice(1)}. `), detailsText,
        t("This is a reason to investigate, not proof — confirm through the FIRs, witnesses and recovered property.")),
      p.same_type ? null : h("p", { class: "notice caution small" }, t("Different crime types: only the offender's personal habits are compared, so this is a weak lead by design."))),
    h("div", { class: "space" }),
    h("div", { class: "grid2" }, firCard(p.case_a, t("FIR A")), firCard(p.case_b, t("FIR B"))),
    h("div", { class: "space" }),
    h("section", { class: "card" },
      h("h3", {}, t("Why these may be the same offender")),
      timing ? reasonRow(timing) : null,
      shared.map(reasonRow),
      different.length ? [h("div", { style: "height:10px" }), h("h3", {}, t("Where they differ")), different.map(reasonRow)] : null,
      notRec.length ? h("p", { class: "notrec" }, t("Not recorded in one of the FIRs, so not used: {list}.", { list: notRec.map(r => field(r.field).toLowerCase()).join(", ") })) : null),
    h("div", { class: "space" }),
    h("section", { class: "grid2" }, h("div", { class: "card stack" }, h("h3", {}, t("FIR A — narrative")), narrative(p.case_a)),
      h("div", { class: "card stack" }, h("h3", {}, t("FIR B — narrative")), narrative(p.case_b))),
    LANG === "hi" ? h("p", { class: "muted small" }, t("FIR text is shown as recorded.")) : null,
    h("div", { class: "space" }),
    h("section", { class: "card stack" }, h("h3", {}, t("Record your assessment")),
      h("div", { class: "actions" }, name, note),
      h("div", { class: "actions" },
        h("button", { class: "btn primary", onclick: () => decide("confirmed") }, t("Linked")),
        h("button", { class: "btn", onclick: () => decide("investigate") }, t("Needs investigation")),
        h("button", { class: "btn", onclick: () => decide("rejected") }, t("Not linked")),
        h("button", { class: "btn", onclick: () => window.print() }, t("Print report")), status),
      h("h3", {}, t("Earlier decisions on this pair")), historyBox,
      h("p", { class: "muted small" }, t("Every lookup and decision is logged with the officer and time for audit."), " ",
        t("Officer names on this demo are typed, not verified; a production deployment signs officers in."))));
}

// ---------- about ----------
function showAbout() {
  setNav("about");
  const ms = META.model_summary || {}, lq = META.lead_quality, sq = META.series_quality, cq = META.check_quality;
  const stat = (big, text) => h("div", { class: "card" }, h("div", { class: "stat" }, big), h("div", { class: "muted small" }, text));
  const card = (title, text) => h("div", { class: "card" }, h("h3", {}, t(title)), h("p", {}, t(text)));
  render(
    h("h1", {}, t("How it works")),
    h("p", { class: "lede" }, t("Police record the modus operandi of every property crime. Offenders repeat their habits — how they enter, what tools they carry, when they strike. This system compares every FIR's MO against every other FIR of the same kind, across all districts and states, and brings the most similar pairs to an analyst.")),
    h("div", { class: "howto" },
      card("1 · Rare habits count most", "Two FIRs that both say \"entered by breaking the lock\" prove little — most burglars do. Both saying \"entered through the roof\" or \"disabled the CCTV\" is far more telling. Each shared detail is weighted by how rare it is."),
      card("2 · Timing matters", "Serial offenders strike in bursts. Two similar FIRs three weeks apart are more telling than two years apart."),
      card("3 · Strength you can read", "Every lead says how often unrelated FIRs look this alike — \"about 1 in 25,000\". That is measured on two lakh random unrelated pairs, not guessed."),
      card("4 · A human decides", "The system never names a person and never claims a link. It narrows thousands of FIRs to a handful worth reading; officers confirm or reject, and every decision is logged.")),
    h("div", { style: "height:22px" }),
    h("h2", {}, t("How well it works (synthetic test data)")),
    h("div", { class: "howto" },
      ms.same_type ? stat(`${Math.round(ms.same_type.hit_at_10 * 100)}%`, t("of cases have a true linked FIR in their top 10 — out of about 15,000 of the same crime type")) : null,
      lq && lq.same_district && lq.same_district.rate ? stat(t("1 in {k}", { k: Math.round(1 / lq.same_district.rate) }), t("same-district leads in the inbox was a real serial link, found with nobody asking")) : null,
      lq && lq.same_state && lq.same_state.rate ? stat(t("1 in {k}", { k: Math.round(1 / lq.same_state.rate) }), t("leads across districts of one state was a real link")) : null,
      lq && lq.cross_state && lq.cross_state.n ? stat(`${num(lq.cross_state.true_all_offenders)} / ${num(lq.cross_state.n)}`, t("cross-state leads were real — so they are marked low confidence, not hidden")) : null,
      sq && sq.pairs && sq.pairs.rate ? stat(t("1 in {k}", { k: Math.round(1 / sq.pairs.rate) }), t("pairs of FIRs inside a possible series were the same offender")) : null,
      cq && cq.flagged ? stat(`${num(cq.truly_misfiled)} / ${num(cq.flagged)}`, t("FIRs flagged as misfiled really were — {r}% of all misfiled FIRs caught", { r: Math.round(cq.recall * 100) })) : null,
      ms.cross_type ? stat(`${(ms.cross_type.hit_at_10 * 100).toFixed(1)}%`, t("for links between different crime types — weak, but keyword search on IPC sections finds none at all")) : null),
    h("p", { class: "muted small" }, t("Measured on offenders held out from training. The data is synthetic: these numbers show the method works on data built to resemble FIRs, not how it will perform on real records.")),
    h("div", { style: "height:14px" }),
    h("div", { class: "card" }, h("h3", {}, t("Safeguards")),
      h("ul", {}, ["No caste, religion or community field exists anywhere in the system.",
        "Personal details are kept out of matching entirely; matching sees only how the crime was committed.",
        "Location is never used to score a match — which is what lets links across states surface at all.",
        "Scores are never shown as probabilities, because a strong-looking number invites false certainty.",
        "Officer names on this demo are typed, not verified; a production deployment signs officers in."].map(x => h("li", {}, t(x))))));
}

// ---------- router ----------
async function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  try {
    if (parts[0] === "case" && parts[1]) return showCase(parts[1]);
    if (parts[0] === "compare" && parts[2]) return showCompare(parts[1], parts[2]);
    if (parts[0] === "series" && parts[1]) return showSeries(parts[1]);
    if (parts[0] === "series") return showSeriesList();
    if (parts[0] === "checks") return showChecks();
    if (parts[0] === "search") return showSearch(decodeURIComponent(parts[1] || ""));
    if (parts[0] === "about") return showAbout();
    return showLeads();
  } catch (e) { fail(e); }
}
(async () => {
  renderBar();
  try { META = await api("/meta"); } catch (e) { return fail(e); }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
