<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-Jurisdiction Linkage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f2240'/%3E%3Ccircle cx='7' cy='7' r='3.6' fill='none' stroke='%23d6b36a' stroke-width='1.8'/%3E%3Cpath d='M9.7 9.7 13 13' stroke='%23d6b36a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page: #f4f5f7; --surface: #ffffff; --surface-2: #f9f9f7; --ink: #0b0b0b; --ink-2: #474641; --muted: #75736d;
    --line: #e1e0d9; --line-2: #c3c2b7; --ring: rgba(11,11,11,0.10);
    --brand: #0f2240; --brand-ink: #ffffff; --accent: #2a78d6; --accent-soft: #e8f1fc;
    --brass: #c9a24f; --brass-ink: #1a1406; --brass-soft: #f6efdc; --paper: #fbf7ec; --paper-line: #e3d8bd; --stamp: #a3261d;
    --strong: #1c5cab; --possible: #3987e5; --weak: #86b6ef; --tier-ink: #ffffff; --weak-ink: #0d366b;
    --support: #2a78d6; --oppose: #e34948; --oppose-soft: #fdecec; --support-soft: #e8f1fc;
    --good: #006300; --good-soft: #e6f4e6; --caution-soft: #fff4d6; --caution-ink: #6b4a00;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #95938c;
      --line: #2c2c2a; --line-2: #383835; --ring: rgba(255,255,255,0.10);
      --brand: #0a1628; --accent: #3987e5; --accent-soft: #16273d;
      --brass: #d6b36a; --brass-ink: #1a1406; --brass-soft: #2e2716; --paper: #1f1d18; --paper-line: #3a352a; --stamp: #e0685e;
      --strong: #6da7ec; --possible: #3987e5; --weak: #256abf; --tier-ink: #0b0b0b; --weak-ink: #ffffff;
      --support: #3987e5; --oppose: #e66767; --oppose-soft: #3a1f1f; --support-soft: #16273d;
      --good: #0ca30c; --good-soft: #13301a; --caution-soft: #3a2f10; --caution-ink: #f2d38a;
      --shadow: none;
    }
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Nirmala UI", sans-serif; }
  :root { --display: "Zilla Slab", Georgia, serif; }
  h1, h2, .stat, .hero h1, .verdict .big, .logo > div { font-family: var(--display); letter-spacing: -.01em; }
  :lang(hi) h1, :lang(hi) h2, :lang(hi) .stat, :lang(hi) .hero h1, :lang(hi) .verdict .big, :lang(hi) .logo > div { font-family: inherit; letter-spacing: 0; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* app bar */
  .bar { background: linear-gradient(90deg, #0a1628, #13294b); color: var(--brand-ink); border-bottom: 2px solid var(--brass); }
  .tw { font-family: "Special Elite", "Courier New", monospace; letter-spacing: .02em; }
  .bar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: .01em; }
  .logo small { display: block; font-weight: 400; font-size: 12px; opacity: .85; }
  .mark { width: 32px; height: 32px; border-radius: 8px; background: rgba(214,179,106,.14); display: grid; place-items: center; }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; align-items: center; }
  nav a { color: var(--brand-ink); text-decoration: none; padding: 7px 12px; border-radius: 8px; font-weight: 500; opacity: .88; }
  nav a[aria-current=page] { opacity: 1; box-shadow: inset 0 -2px 0 var(--brass); border-radius: 8px 8px 0 0; }
  .lang { background: transparent; color: var(--brand-ink); border: 1px solid rgba(255,255,255,.45); border-radius: 8px; padding: 5px 10px; margin-left: 6px; }
  .pill-synth { font-size: 12px; background: rgba(255,255,255,.18); padding: 3px 10px; border-radius: 99px; }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }
  @media (max-width: 700px) { main, .bar-inner { padding-left: 16px; padding-right: 16px; }
    nav { margin-left: 0; flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; } nav a { white-space: nowrap; } }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  :lang(hi) h3 { text-transform: none; letter-spacing: 0; font-size: 14px; }
  .lede { color: var(--ink-2); margin: 0 0 18px; max-width: 800px; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
  .stack > * + * { margin-top: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .space { height: 16px; }

  /* filters */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .filters label { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  select, input[type=search], input[type=text], textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; min-width: 170px; }
  .notice { border-radius: 10px; padding: 12px 14px; font-size: 14px; margin: 0 0 14px; }
  .notice.info { background: var(--accent-soft); }
  .notice.caution { background: var(--caution-soft); color: var(--caution-ink); }
  .notice .btn { margin-left: 8px; }

  /* tier badge */
  .tier { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
  .tier.strong { background: var(--strong); color: var(--tier-ink); }
  .tier.possible { background: var(--possible); color: var(--tier-ink); }
  .tier.weak { background: var(--weak); color: var(--weak-ink); }
  .dots { display: inline-flex; gap: 2px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .35; }
  .dots i.on { opacity: 1; }
  .rarity { font-size: 13px; color: var(--ink-2); }

  /* cards and lists */
  .leads { display: grid; gap: 12px; }
  .lead { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow);
          display: grid; grid-template-columns: 1fr auto; gap: 10px 18px; cursor: pointer; }
  .lead { border-left: 4px solid var(--line-2); transition: transform .12s ease, box-shadow .12s ease; }
  .lead.strong { border-left-color: var(--strong); } .lead.possible { border-left-color: var(--possible); } .lead.weak { border-left-color: var(--weak); }
  .lead[tabindex]:hover { border-color: var(--line-2); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,.10); }
  @media (prefers-reduced-motion: reduce) { .lead { transition: none; } .lead[tabindex]:hover { transform: none; } }
  .lead-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .crime { font-weight: 600; }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; grid-column: 1 / -1; }
  .place { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; min-width: 0; }
  .place b { display: block; font-size: 15px; }
  .place span { font-size: 12.5px; color: var(--muted); }
  .gap { text-align: center; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .gap svg { display: block; margin: 0 auto 2px; }
  @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } .gap { text-align: left; } .gap svg { display: none; } }
  .full { grid-column: 1 / -1; }
  .reasons-inline { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: var(--support-soft); border-radius: 99px; padding: 3px 10px; }
  .xstate { font-size: 12px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 1px 8px; }
  .truth { font-size: 12px; font-weight: 600; color: var(--good); background: var(--good-soft); border-radius: 99px; padding: 2px 9px; }
  .btn { background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 14px; font-weight: 500; }
  .btn:hover { border-color: var(--ink-2); }
  .btn.primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); font-weight: 600; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .lanes { display: flex; gap: 6px; align-items: flex-end; border-bottom: 2px solid var(--line-2); margin-bottom: 0; }
  .lane { flex: 1 1 0; text-align: left; background: var(--surface-2); border: 1px solid var(--line-2); border-bottom: 0;
          border-radius: 10px 10px 0 0; padding: 9px 14px; display: grid; gap: 2px; position: relative; top: 2px; }
  .lane span { font-size: 12.5px; color: var(--muted); }
  .lane[aria-selected=true] { background: var(--surface); box-shadow: inset 0 3px 0 var(--brass); }
  .lane[aria-selected=true]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--surface); }
  .lane-help { margin: 10px 0 14px; }
  @media (max-width: 640px) { .lanes { flex-wrap: wrap; border-bottom: 0; } .lane { flex: 1 1 100%; border-bottom: 1px solid var(--line-2); border-radius: 10px; top: 0; } }
  .pager { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 16px; }
  .route { font-weight: 600; font-size: 15px; }
  .route .arrow { color: var(--muted); font-weight: 400; }
  .count { font-weight: 700; background: var(--ink); color: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: 13px; }

  /* search */
  .searchbox { display: flex; gap: 10px; }
  .searchbox input { flex: 1; font-size: 17px; padding: 12px 14px; min-width: 0; }
  .results { display: grid; gap: 8px; margin-top: 14px; }
  .result { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 14px;
            background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; cursor: pointer; flex-wrap: wrap; }
  .result:hover { border-color: var(--line-2); }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }

  /* case + compare */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .fir { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin: 0; }
  .fir dt { color: var(--muted); }
  .fir dd { margin: 0; overflow-wrap: anywhere; }
  .firhead { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 10px; flex-wrap: wrap; }
  .firhead b { font-size: 17px; }
  .verdict { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .verdict .big { font-size: 20px; font-weight: 700; }
  .explain { color: var(--ink-2); margin: 8px 0 0; max-width: 820px; }
  .reason { display: grid; grid-template-columns: 26px 1fr 150px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .reason:first-of-type { border-top: 0; }
  @media (max-width: 560px) { .reason { grid-template-columns: 26px 1fr; } .reason .weight { grid-column: 2; text-align: left; } }
  .reason .ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .ico.shared { background: var(--support-soft); color: var(--support); }
  .ico.different { background: var(--oppose-soft); color: var(--oppose); }
  .ico.timing { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .reason .what { font-weight: 600; }
  .reason .why { font-size: 13px; color: var(--muted); }
  .weight { font-size: 12px; color: var(--muted); text-align: right; }
  .weight .track { height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; margin-bottom: 3px; border: 1px solid var(--line); }
  .weight .fill { position: absolute; top: -1px; bottom: -1px; border-radius: 4px; }
  .notrec { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .narr { white-space: pre-wrap; font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions textarea { flex: 1 1 260px; min-height: 40px; }
  .actions input { flex: 0 1 220px; }
  .saved { color: var(--good); font-weight: 600; }
  .history { display: grid; gap: 6px; font-size: 13.5px; }
  .history div { padding: 6px 10px; background: var(--surface-2); border-radius: 8px; }
  .shortlist { display: grid; gap: 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 99px; padding: 6px 14px; }
  .tabs button[aria-pressed=true] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .back { display: inline-block; margin-bottom: 12px; text-decoration: none; }
  .modes { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
  .modes button { border: 0; background: var(--surface); padding: 8px 14px; font-weight: 500; }
  .modes button[aria-pressed=true] { background: var(--accent); color: #fff; }
  .mode-help { margin: 4px 0 14px; max-width: 820px; }
  .ico.place, .ico.distinct { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .stat { font-size: 28px; font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* series */
  .map { height: 340px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
  .map > svg { width: 100%; height: 100%; display: block; }
  .pin span { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff;
              font: 700 12px/1 system-ui, sans-serif; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .timeline svg { width: 100%; height: auto; display: block; }
  .tablewrap { overflow-x: auto; }
  table.firs { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.firs th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12.5px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  table.firs td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.firs td.num { font-weight: 700; color: var(--accent); }


  /* landing */
  .hero { background: radial-gradient(120% 140% at 85% 15%, #1d3b66 0%, #0f2240 45%, #08121f 100%); color: #eef3fb;
          border-bottom: 2px solid var(--brass); overflow: hidden; }
  .hero-inner { max-width: 1180px; margin: 0 auto; padding: 54px 20px 48px; display: grid; grid-template-columns: 1.02fr 1fr; gap: 34px; align-items: center; }
  @media (max-width: 900px) { .hero-inner { grid-template-columns: 1fr; padding: 32px 16px 28px; } }
  footer .foot-inner { max-width: 1180px; margin: 0 auto; padding: 26px 20px 40px; display: flex; gap: 14px 28px; flex-wrap: wrap;
                       justify-content: space-between; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); margin-top: 8px; }
  footer a { color: var(--ink-2); }
  .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 600; color: #d6b36a; margin: 0 0 12px; }
  :lang(hi) .eyebrow { text-transform: none; letter-spacing: .02em; font-size: 13px; }
  .hero h1 { font-size: 40px; line-height: 1.12; margin: 0 0 14px; letter-spacing: -.01em; }
  .hero h1 span { display: block; color: #9cc3f5; }
  @media (max-width: 600px) { .hero h1 { font-size: 30px; } }
  .hero-lede { color: #c9d6ea; font-size: 16.5px; max-width: 520px; margin: 0 0 22px; }
  .hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
  .cta { display: inline-block; text-decoration: none; font-weight: 600; border-radius: 10px; padding: 11px 18px; }
  .cta.primary { background: #d6b36a; color: #1a1406; }
  .cta.ghost { color: #eef3fb; border: 1px solid rgba(238,243,251,.35); }
  .cta:hover { filter: brightness(1.08); }
  .hero-note { color: #9fb2cc; font-size: 13px; margin: 18px 0 0; }
  .board svg { width: 100%; height: auto; display: block; }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
  @media (max-width: 900px) { .strip { grid-template-columns: repeat(2, 1fr); } }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 800px) { .steps { grid-template-columns: 1fr; } }
  .step-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
            background: var(--accent-soft); color: var(--accent); margin-bottom: 8px; }
  /* new FIR */
  .formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; }
  .formgrid label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 500; align-content: start; }
  .formgrid select, .formgrid input { min-width: 0; width: 100%; }
  .tagset { display: flex; flex-wrap: wrap; gap: 6px; }
  .tagset label { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; background: var(--surface-2);
                  border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; color: var(--ink); }
  details.why { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 8px; }
  details.why summary { cursor: pointer; color: var(--accent); font-weight: 500; }
  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  @media (prefers-reduced-motion: reduce) { .cta { transition: none; } }

  /* case files */
  .folder { position: relative; background: var(--paper); border: 1px solid var(--paper-line); border-radius: 4px 12px 12px 12px; padding: 22px 18px 16px; margin-top: 18px; box-shadow: var(--shadow); }
  .folder .tab { position: absolute; top: -18px; left: -1px; background: var(--paper); border: 1px solid var(--paper-line); border-bottom: 0;
                 border-radius: 8px 8px 0 0; padding: 2px 14px; font-size: 13.5px; color: var(--ink); }
  .folder .firhead b { font-size: 15px; color: var(--muted); font-weight: 600; }
  .stamp { display: inline-block; transform: rotate(-5deg); border: 3px double currentColor; border-radius: 6px; padding: 4px 12px;
           font-size: 19px; text-transform: uppercase; letter-spacing: .08em; opacity: .9; }
  :lang(hi) .stamp { text-transform: none; letter-spacing: .02em; }
  .stamp.strong { color: var(--stamp); } .stamp.possible { color: #9a6b00; } .stamp.weak { color: var(--muted); }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .stamp.possible { color: #e3b341; } }
  .dossier-head { display: grid; grid-template-columns: auto 1fr; gap: 18px 24px; align-items: center; }
  @media (max-width: 640px) { .dossier-head { grid-template-columns: 1fr; } }
  /* loading lens */
  .lens-wait { width: 56px; height: 56px; margin: 0 auto 12px; position: relative; }
  .lens-wait svg { position: absolute; inset: 0; animation: lens-orbit 1.6s ease-in-out infinite; }
  @keyframes lens-orbit { 0% { transform: translate(-10px, 0) rotate(-8deg); } 50% { transform: translate(10px, -4px) rotate(8deg); } 100% { transform: translate(-10px, 0) rotate(-8deg); } }
  @media (prefers-reduced-motion: reduce) { .lens-wait svg { animation: none; } }
  /* investigation board */
  .inv-board svg { width: 100%; height: auto; display: block; border-radius: 10px; }
  /* reading FIR text */
  .readbox textarea { width: 100%; min-height: 120px; resize: vertical; font-size: 14px; line-height: 1.5; }
  .readout { white-space: pre-wrap; font-size: 13.5px; line-height: 1.6; background: var(--paper); border: 1px solid var(--paper-line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .readout mark { background: var(--brass-soft); color: inherit; border-bottom: 2px solid var(--brass); padding: 0 1px; }
  .fromtext { font-size: 11px; font-weight: 600; color: var(--brass-ink); background: var(--brass-soft); border: 1px solid var(--brass); border-radius: 99px; padding: 0 7px; margin-left: 6px; }

function investigationBoard(s) {
  // The series as case files pinned in date order, joined by red string where the system found a link.
  const n = s.members.length, W = 900, cw = 150, ch = 92;
  const H = n > 4 ? 330 : 250;
  const pos = s.members.map((m, i) => [30 + (n === 1 ? 0 : i * (W - 60 - cw) / (n - 1)), i % 2 ? H - ch - 34 : 34]);
  const at = Object.fromEntries(s.members.map((m, i) => [m.case_id, i]));
  const pin = i => [pos[i][0] + cw / 2, pos[i][1] + 3];
  const strings = s.links.map(l => {
    const [a, b] = [pin(at[l.a]), pin(at[l.b])];
    const w = { strong: 2.6, possible: 1.8, weak: 1.2 }[l.tier] || 1.5;
    const sag = Math.max(18, Math.abs(b[0] - a[0]) / 6);
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + sag];
    return `<path d="M${a[0]} ${a[1]} Q ${mid[0]} ${mid[1]} ${b[0]} ${b[1]}" fill="none" stroke="#b83227" stroke-width="${w}" stroke-linecap="round" opacity=".9"/>`;
  }).join("");
  const cards = s.members.map((m, i) => {
    const [x, y] = pos[i], r = [-3, 2, -1.5, 3, -2, 1.5][i % 6];
    return `<g transform="rotate(${r} ${x + cw / 2} ${y + ch / 2})">
      <rect x="${x + 3}" y="${y + 4}" width="${cw}" height="${ch}" rx="4" fill="#000" opacity=".25"/>
      <rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="4" fill="#f6f0df" stroke="#cdbf9b"/>
      <text x="${x + 10}" y="${y + 30}" font-size="11.5" font-family="'Special Elite','Courier New',monospace" fill="#1d1d1b">${esc(m.fir_no)}</text>
      <text x="${x + 10}" y="${y + 50}" font-size="12" font-weight="600" font-family="system-ui,sans-serif" fill="#1d1d1b">${esc(district(m.district))}</text>
      <text x="${x + 10}" y="${y + 67}" font-size="11" font-family="system-ui,sans-serif" fill="#5b574d">${esc(date(m.occurred_from))}</text>
      <circle cx="${x + cw - 18}" cy="${y + ch - 18}" r="11" fill="#0f2240"/><text x="${x + cw - 18}" y="${y + ch - 14}" font-size="11" font-weight="700" text-anchor="middle" fill="#d6b36a" font-family="system-ui,sans-serif">${i + 1}</text>
    </g>`;
  }).join("");
  const pins = s.members.map((m, i) => { const [x, y] = pin(i); return `<circle cx="${x}" cy="${y}" r="6" fill="#d8453a" stroke="#6e1a14" stroke-width="1.5"/>`; }).join("");
  return svgEl(`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("Investigation board"))}">
    <defs><pattern id="cork" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#16263f"/><circle cx="1" cy="1" r=".7" fill="#23385a"/><circle cx="4" cy="3.5" r=".6" fill="#1d3150"/></pattern></defs>
    <rect width="${W}" height="${H}" fill="url(#cork)"/>${strings}${cards}${pins}</svg>`);
}
function positions(members) {
  const seen = {};
  return members.map(m => {
    const base = DISTRICT_LL[m.district] || [20, 77];
    const k = seen[m.district] = (seen[m.district] || 0) + 1;
    const r = k === 1 ? 0 : 0.07, a = k * 2.4;

}
let leafletLoading = null;

  if (window.L) return Promise.resolve(window.L);

    const css = h("link", { rel: "stylesheet", href: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" });
    const js = h("script", { src: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" });
    js.onload = () => resolve(window.L);
    js.onerror = () => { leafletLoading = null; reject(new Error("map library unavailable")); };
    setTimeout(() => reject(new Error("map library timed out")), 8000);
    document.head.append(css, js);
  });

}
async function drawMap(box, members) {
  const pts = positions(members);
  try {
    const L = await loadLeaflet();
    if (!box.isConnected) return;
    const map = L.map(box, { scrollWheelZoom: false, attributionControl: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 12, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#2a78d6";
    L.polyline(pts, { color: accent, weight: 2, dashArray: "6 6" }).addTo(map);
    pts.forEach((p, i) => L.marker(p, { icon: L.divIcon({ className: "pin", html: `<span>${i + 1}</span>`, iconSize: [24, 24], iconAnchor: [12, 12] }),
      title: `${members[i].fir_no} · ${district(members[i].district)} · ${date(members[i].occurred_from)}` }).addTo(map));
    map.fitBounds(L.latLngBounds(pts).pad(0.35), { maxZoom: 9 });
  } catch (e) {
    box.replaceChildren(schematicMap(members, pts), h("div", { class: "muted small", style: "padding:6px 10px" }, t("Map tiles could not load; showing positions only.")));
  }
}
function schematicMap(members, pts) {

  const xy = ([la, lo]) => [((lo - lon0) / (lon1 - lon0)) * W, ((lat0 - la) / (lat0 - lat1)) * H];
  const all = Object.entries(DISTRICT_LL).map(([d, ll]) => { const [x, y] = xy(ll);
    return `<circle cx="${x}" cy="${y}" r="3" fill="var(--line-2)"/><text x="${x + 5}" y="${y + 4}" font-size="10" fill="var(--muted)">${esc(district(d))}</text>`; }).join("");
  const path = pts.map(p => xy(p).join(",")).join(" ");
  const pins = pts.map((p, i) => { const [x, y] = xy(p);
    return `<circle cx="${x}" cy="${y}" r="11" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${x}" y="${y + 4}" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">${i + 1}</text>`; }).join("");
  return svgEl(`<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${all}<polyline points="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>${pins}</svg>`);
}

  // Labels go on the nearest free level (above/below, then further out) so close dates never overlap.

  let dotEnd = -1e9, row = 0;
  const marks = members.map((m, i) => {
    const cx = x(ts[i]);
    row = cx - dotEnd < 22 ? row + 1 : 0;               // stack dots that would touch
    dotEnd = cx;
    const cy = AXIS - row * 24;
    const lv = levels.find(l => cx - l.end > 78) || levels.reduce((a, b) => (a.end < b.end ? a : b));
    lv.end = cx;
    const ty = lv.y, tick = lv.up ? [ty + 18, cy - 12] : [cy + 12, ty - 12];
    const crowded = i && cx - x(ts[i - 1]) < 46 && i !== members.length - 1;
    return `<line x1="${cx}" y1="${tick[0]}" x2="${cx}" y2="${tick[1]}" stroke="var(--line-2)"/>` +
      `<circle cx="${cx}" cy="${cy}" r="11" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>` +
      `<text x="${cx}" y="${cy + 4}" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">${i + 1}</text>` +
      `<text x="${cx}" y="${ty}" font-size="11" text-anchor="middle" fill="var(--ink-2)">${esc(district(m.district))}</text>` +
      (crowded ? "" : `<text x="${cx}" y="${ty + 13}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(date(m.occurred_from))}</text>`);
  }).join("");
  return svgEl(`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("When"))}"><line x1="${P - 10}" y1="${AXIS}" x2="${W - P + 10}" y2="${AXIS}" stroke="var(--line-2)" stroke-width="2"/>${marks}</svg>`);
}

      h("div", { class: "track" }, h("div", { class: "fill", style: fill })), strengthWord(r.bits)));
}

    LANG === "hi" ? h("p", { class: "muted small" }, t("FIR text is shown as recorded.")) : null,
    h("div", { class: "space" }),
    h("section", { class: "card stack" }, h("h3", {}, t("Record your assessment")),
      h("div", { class: "actions" }, name, note),
      h("div", { class: "actions" },
        h("button", { class: "btn primary", onclick: () => decide("confirmed") }, t("Linked")),
        h("button", { class: "btn", onclick: () => decide("investigate") }, t("Needs investigation")),
        h("button", { class: "btn", onclick: () => decide("rejected") }, t("Not linked")),
        h("button", { class: "btn", onclick: () => window.print() }, t("Print report")), status),
      h("h3", {}, t("Earlier decisions on this pair")), historyBox,
      h("p", { class: "muted small" }, t("Every lookup and decision is logged with the officer and time for audit."), " ",
        t("Officer names on this demo are typed, not verified; a production deployment signs officers in."))));
}

// ---------- about ----------
function showAbout() {
  setNav("about");
  const ms = META.model_summary || {}, lq = META.lead_quality, sq = META.series_quality, cq = META.check_quality;
  const stat = (big, text) => h("div", { class: "card" }, h("div", { class: "stat" }, big), h("div", { class: "muted small" }, text));
  const card = (title, text) => h("div", { class: "card" }, h("h3", {}, t(title)), h("p", {}, t(text)));
  render(
    pageHead("About", "How it works", null),
    h("p", { class: "lede" }, t("Police record the modus operandi of every property crime. Offenders repeat their habits — how they enter, what tools they carry, when they strike. This system compares every FIR's MO against every other FIR of the same kind, across all districts and states, and brings the most similar pairs to an analyst.")),
    h("div", { class: "howto" },
      card("1 · Rare habits count most", "Two FIRs that both say \"entered by breaking the lock\" prove little — most burglars do. Both saying \"entered through the roof\" or \"disabled the CCTV\" is far more telling. Each shared detail is weighted by how rare it is."),
      card("2 · Timing matters", "Serial offenders strike in bursts. Two similar FIRs three weeks apart are more telling than two years apart."),
      card("3 · Strength you can read", "Every lead says how often unrelated FIRs look this alike — \"about 1 in 25,000\". That is measured on two lakh random unrelated pairs, not guessed."),
      card("4 · A human decides", "The system never names a person and never claims a link. It narrows thousands of FIRs to a handful worth reading; officers confirm or reject, and every decision is logged.")),
    h("div", { style: "height:22px" }),
    h("h2", {}, t("How well it works (synthetic test data)")),
    h("div", { class: "howto" },
      ms.same_type ? stat(`${Math.round(ms.same_type.hit_at_10 * 100)}%`, t("of cases have a true linked FIR in their top 10 — out of about 15,000 of the same crime type")) : null,
      ms.nearby ? stat(`${Math.round(ms.nearby.hit_at_10 * 100)}%`, t("with \"nearby first\" — at the cost of most links across state borders")) : null,
      lq && lq.same_district && lq.same_district.rate ? stat(t("1 in {k}", { k: Math.round(1 / lq.same_district.rate) }), t("same-district leads in the inbox was a real serial link, found with nobody asking")) : null,
      lq && lq.same_state && lq.same_state.rate ? stat(t("1 in {k}", { k: Math.round(1 / lq.same_state.rate) }), t("leads across districts of one state was a real link")) : null,
      lq && lq.cross_state && lq.cross_state.n ? stat(`${num(lq.cross_state.true_all_offenders)} / ${num(lq.cross_state.n)}`, t("cross-state leads were real — so they are marked low confidence, not hidden")) : null,
      sq && sq.pairs && sq.pairs.rate ? stat(t("1 in {k}", { k: Math.round(1 / sq.pairs.rate) }), t("pairs of FIRs inside a possible series were the same offender")) : null,
      cq && cq.flagged ? stat(`${num(cq.truly_misfiled)} / ${num(cq.flagged)}`, t("FIRs flagged as misfiled really were — {r}% of all misfiled FIRs caught", { r: Math.round(cq.recall * 100) })) : null,
      ms.cross_type ? stat(`${(ms.cross_type.hit_at_10 * 100).toFixed(1)}%`, t("for links between different crime types — weak, but keyword search on IPC sections finds none at all")) : null),
    h("p", { class: "muted small" }, t("Measured on offenders held out from training. The data is synthetic: these numbers show the method works on data built to resemble FIRs, not how it will perform on real records.")),
    h("div", { style: "height:14px" }),
    h("div", { class: "card" }, h("h3", {}, t("Safeguards")),
      h("ul", {}, ["No caste, religion or community field exists anywhere in the system.",
        "Personal details are kept out of matching entirely; matching sees only how the crime was committed.",
        "Location is not used unless an officer picks \"nearby first\"; the default ranking is location-blind, which is what lets links across states surface at all.",
        "Scores are never shown as probabilities, because a strong-looking number invites false certainty.",
        "Officer names on this demo are typed, not verified; a production deployment signs officers in."].map(x => h("li", {}, t(x))))));
}

// ---------- router ----------
async function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  try {
    if (parts[0] === "case" && parts[1]) return showCase(parts[1], "same", parts[2] === "nearby" ? "nearby" : "blind");
    if (parts[0] === "compare" && parts[2]) return showCompare(parts[1], parts[2], parts[3] === "nearby" ? "nearby" : "blind");
    if (parts[0] === "series" && parts[1]) return showSeries(parts[1]);
    if (parts[0] === "series") return showSeriesList();
    if (parts[0] === "checks") return showChecks();
    if (parts[0] === "search") return showSearch(decodeURIComponent(parts[1] || ""));
    if (parts[0] === "about") return showAbout();
    if (parts[0] === "new") return showNew();
    if (parts[0] === "leads") return showLeads();
    return showHome();
  } catch (e) { fail(e); }
}
(async () => {
  renderBar();
  try { META = await api("/meta"); } catch (e) { return fail(e); }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
