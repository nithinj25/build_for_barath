AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Cross-jurisdiction crime linkage — skeleton stack. Proves the deploy path
  (CloudFormation, IAM, Lambda packaging, HTTP API) before it holds any data.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../handlers/
      Handler: health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET

Outputs:
  HealthUrl:
    Description: 'GET this; expect {"status": "ok"}'
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
