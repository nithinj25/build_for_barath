# Adapter: Maharashtra (MH) feed → canonical case record.
#
# Everything the pipeline knows about this state's feed lives here; the
# normaliser has no per-state code, so onboarding a state is a new file like
# this one. Bootstrapped 2026-09-17 from the synthetic feeds' format
# definition, then owned by the pipeline: linkage.normalise never reads
# config/ or linkage.generate.
#
# layout          structured: one column per MO field
#                 free_text_mo: MO lives in prose; fields need LLM extraction
# columns         native column → canonical field (a canonical field with no
#                 column here is structurally ABSENT in this state)
# crime_type      native label → canonical crime type
# values          canonical field → native label → canonical value. Labels
#                 match case- and whitespace-insensitively. Tag fields map
#                 their "nothing" label to none_observed (an empty set,
#                 which is not the same as a blank cell).

state_code: MH
state_name: Maharashtra
layout: structured
narrative_language: en
datetime_format: '%d/%m/%Y %H:%M'
date_only_format: '%d/%m/%Y'
multi_value_delimiter: ;
columns:
  FIR_NO: fir_no
  DISTRICT: district
  POLICE_STATION: police_station
  CRIME_HEAD: crime_type
  OCCURRENCE_FROM: occurred_from
  OCCURRENCE_TO: occurred_to
  REGISTRATION_DATE: registered_at
  NO_OF_ACCUSED: group_size_est
  WEAPONS_TOOLS: tools
  CONCEALMENT: counter_forensic
  TARGET_TYPE: target_selection
  PROPERTY_STOLEN: property_taken
  MODE_OF_ARRIVAL: approach_mode
  MODE_OF_ESCAPE: exit_mode
  PLACE_OF_ENTRY: entry_point
  MODE_OF_ENTRY: entry_method
  PREMISES_TYPE: premise
  PREMISES_STATUS: occupancy
  SEARCH_TYPE: search_pattern
  VEHICLE_TYPE: vehicle_class
  VEHICLE_START_METHOD: ignition_method
  PARKING_PLACE: location_type
  OFFENDER_VEHICLE: vehicle_used
  VICTIM_ACTIVITY: victim_activity
  ESCAPE_ROUTE: escape_direction
  ATM_SITE_TYPE: machine_type
  ATM_ATTACK: attack_method
  ALARM_STATUS: alarm_defeated
  FIR_CONTENTS: narrative
crime_type:
  HOUSE BREAKING: BURGLARY_RESIDENTIAL
  SHOP BREAKING: BURGLARY_COMMERCIAL
  MOTOR VEHICLE THEFT: VEHICLE_THEFT
  CHAIN SNATCHING: SNATCHING
  ATM TAMPERING: ATM_TAMPERING
