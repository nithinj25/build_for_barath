# Adapter: Karnataka (KA) feed → canonical case record.
#
# Everything the pipeline knows about this state's feed lives here; the
# normaliser has no per-state code, so onboarding a state is a new file like
# this one. Bootstrapped 2026-09-17 from the synthetic feeds' format
# definition, then owned by the pipeline: linkage.normalise never reads
# config/ or linkage.generate.
#
# layout          structured: one column per MO field
#                 free_text_mo: MO lives in prose; fields need LLM extraction
# columns         native column → canonical field (a canonical field with no
#                 column here is structurally ABSENT in this state)
# crime_type      native label → canonical crime type
# values          canonical field → native label → canonical value. Labels
#                 match case- and whitespace-insensitively. Tag fields map
#                 their "nothing" label to none_observed (an empty set,
#                 which is not the same as a blank cell).

state_code: KA
state_name: Karnataka
layout: structured
narrative_language: en
datetime_format: '%d-%b-%Y %H%M hrs'
date_only_format: '%d-%b-%Y'
multi_value_delimiter: ' / '
columns:
  FIR No.: fir_no
  FIR Date: registered_at
  Unit Name: district
  PS Name: police_station
  Crime Head: crime_type
  Occurrence From: occurred_from
  Occurrence To: occurred_to
  MO - Tools: tools
  MO - Entry Point: entry_point
  MO - Entry: entry_method
  MO - Premises: premise
  MO - Search: search_pattern
  Accused Count: group_size_est
  MO - Concealment: counter_forensic
  MO - Target: target_selection
  Property Lost: property_taken
  Came By: approach_mode
  Fled By: exit_mode
  Vehicle Category: vehicle_class
  MO - Vehicle Start: ignition_method
  Place Of Theft: location_type
  Offender Vehicle: vehicle_used
  Victim Was: victim_activity
  Fled Towards: escape_direction
  ATM Location Type: machine_type
  MO - ATM: attack_method
  Alarm: alarm_defeated
  Brief Facts: narrative
crime_type:
  Burglary - Dwelling: BURGLARY_RESIDENTIAL
  Burglary - Commercial: BURGLARY_COMMERCIAL
  Theft - Vehicle: VEHICLE_THEFT
  Theft - Chain Snatching: SNATCHING
  Cheating - ATM: ATM_TAMPERING
values:
  group_size_est:
    Single: '1'
    Two-Three: 2-3
    Gang (4+): 4+
  tools:
